name: Publish to Comfy Registry

# Publishes this node when pyproject.toml changes on main, or by hand.
# comfy-cli comes from .github/requirements/publish.txt: a reviewed release
# with every dependency pinned by hash. The registry key is a secret
# of the comfy-registry environment, which runs only from main and waits for the
# owner's approval; it reaches only the publish step.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node to the registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'EmpirioLabs-AI' }}
    environment: comfy-registry
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install comfy-cli
        run: |
          python -m pip install --require-hashes --only-binary :all: \
            -r .github/requirements/publish.txt

      - name: Configure comfy-cli
        run: comfy --skip-prompt --no-enable-telemetry env

      - name: Publish custom node
        env:
          # A Comfy Registry publishing key, a secret of the comfy-registry environment.
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
