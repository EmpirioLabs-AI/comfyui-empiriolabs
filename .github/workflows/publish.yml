name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node to the registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'EmpirioLabs-AI' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          # A Comfy Registry publishing key, stored as a repository secret.
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
